apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-0
  namespace: pipeline
spec:
  template:
    metadata:
      labels:
        app: worker
        shard: "0"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: python:3.11-slim
          command: ["python", "/app/worker/worker.py"]
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: TEACHER_URL
              value: "http://host.k3d.internal:11434/api/generate"
          volumeMounts:
            - name: workspace
              mountPath: /app
      volumes:
        - name: workspace
          hostPath:
            path: /src
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-1
  namespace: pipeline
spec:
  template:
    metadata:
      labels:
        app: worker
        shard: "1"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: python:3.11-slim
          command: ["python", "/app/worker/worker.py"]
          env:
            - name: SHARD_INDEX
              value: "1"
            - name: SHARD_COUNT
              value: "2"
            - name: TEACHER_URL
              value: "http://host.k3d.internal:11434/api/generate"
          volumeMounts:
            - name: workspace
              mountPath: /app
      volumes:
        - name: workspace
          hostPath:
            path: /src

